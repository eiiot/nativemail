app = "nativemail-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.relay"

[env]
  NOTIFICATION_RELAY_OBSERVABILITY_PATH = "/data/observability.jsonl"
  NOTIFICATION_RELAY_STORE_PATH = "/data/notification-relay.json"
  PORT = "8787"

[[mounts]]
  source = "nativemail_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
